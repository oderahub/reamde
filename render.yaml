# Render blueprint for the Dev Traders Program 24/7 volume worker.
# Runs the EIP-7702 atomic round-trip bot at a strict spread gate, paced (~$90k/
# day) to spend the full $150 into its ~$1.06M capital-bound volume ceiling by
# ~day 12 without leaving capital unspent. Restart-safe by design: the loop reads
# balances fresh each tick and only ever holds flat inventory, so a crash/redeploy
# mid-run resumes cleanly.
#
# Secrets to set in the Render dashboard (sync:false): PRIVATE_KEY.
# IMPL_ADDRESS is the one-time-deployed mainnet round-trip contract (public).
services:
  - type: worker
    name: dreamdex-volume-worker
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -e .
    startCommand: python -m dreamdex_bot.volume_bot_7702 --days 15 --broadcast --target-daily 90000 --cross-bps 3 --max-spread-bps 3.0
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 120
    envVars:
      # Stream logs immediately (Python block-buffers stdout off a TTY).
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NETWORK
        value: mainnet
      - key: IMPL_ADDRESS
        value: "0x91199efaF4d2504a5CA75f9fA5fE7d4e916F73D2"
      # Competition wallet key — set in the dashboard, never commit.
      - key: PRIVATE_KEY
        sync: false
